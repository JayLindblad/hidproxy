[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hidproxy"
version = "0.1.0"
description = "Bluetooth-to-USB HID proxy for Raspberry Pi"
requires-python = ">=3.7"
dependencies = [
    "evdev>=1.6",
    "pyudev>=0.24",
    "dbus-next>=0.2.3",
]

[project.scripts]
hidproxy = "hidproxy.main:main"

[tool.setuptools]
packages = ["hidproxy"]
